name: Verify Liturgy & Scripture Integrity

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Unit Tests
        run: npm test

      - name: Verify Cryptographic Hashes
        run: node scripts/verify_liturgy_integrity.js
